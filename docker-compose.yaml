services:
  fastapi:
    image: julioraulcarranzaruiz/fastapi:dev
    build:
      context: .
      dockerfile: src/api/Dockerfile
    ports:
      - "8000:8000"

  streamlit:
    image: julioraulcarranzaruiz/streamlit:dev
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: http://fastapi:8000
      